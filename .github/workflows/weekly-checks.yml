# The system tells on itself (OPERATIONS.md): these checks otherwise run
# only when someone is actively working, so a quiet fortnight would hide a
# revoked token, an edge-injected script or a broken build until the next
# session — the Cloudflare beacon sat unnoticed for days for exactly this
# reason. A failed run makes GitHub email the owner with zero dependence on
# the site's own email path, which is one of the things being checked.
name: weekly-checks

# Least privilege: this job reads the repository and nothing else. Without
# an explicit block the default token can carry write scopes, so a
# compromised action in the chain below could push. Actions are pinned to
# full commit SHAs rather than mutable tags — "@v4" is a moving pointer the
# action's owner can repoint at any time, which is the supply-chain path
# that matters here (security review, 22 Aug 2026). Dependabot keeps the
# pins current; see .github/dependabot.yml, because a pin nobody updates
# becomes its own stale-dependency problem.
permissions:
  contents: read

on:
  schedule:
    # Mondays 04:00 UTC (07:00 Nairobi)
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # npm test builds first, then boots the built Worker in local workerd —
      # no Cloudflare credentials involved.
      - run: npm test
      # And the one no local test can do: what does Cloudflare actually
      # serve to a browser right now?
      - run: npm run check:live
